parse_config:
  # Affiche le vrai caractère français pour chaque alias FR_xxx (défini dans
  # config/keys_fr.h), au lieu du nom brut du code HID envoyé au PC.
  raw_binding_map:
    "&kp FR_A": "A"
    "&kp FR_Z": "Z"
    "&kp FR_Q": "Q"
    "&kp FR_W": "W"
    "&kp FR_M": "M"
    "&kp FR_COMMA": ","
    "&kp FR_SEMI": ";"
    "&kp FR_COLON": ":"
    "&kp FR_EXCL": "!"
    "&kp FR_AMPR": "&"
    "&kp FR_EACUTE": "é"
    "&kp FR_DQT": '"'
    "&kp FR_QUOT": "'"
    "&kp FR_LPAR": "("
    "&kp FR_HYPHEN": "-"
    "&kp FR_EGRAVE": "è"
    "&kp FR_UNDER": "_"
    "&kp FR_CCEDIL": "ç"
    "&kp FR_AGRAVE": "à"
    "&kp FR_RPAR": ")"
    "&kp FR_EQUAL": "="
    "&kp FR_TILDE": "~"
    "&kp FR_HASH": "#"
    "&kp FR_LBRACE": "{"
    "&kp FR_LBRKT": "["
    "&kp FR_PIPE": "|"
    "&kp FR_GRAVE": "`"
    "&kp FR_BSLH": "\\"
    "&kp FR_CARET": "^"
    "&kp FR_AT": "@"
    "&kp FR_RBRKT": "]"
    "&kp FR_RBRACE": "}"
    "&kp FR_EURO": "€"
    "&kp FR_UGRAVE": "ù"
    "&kp FR_PERCENT": "%"
    "&kp FR_DOLLAR": "$"
    "&kp FR_LT": "<"
    "&kp FR_GT": ">"
